services:
  pid-annotator:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64  # Raspberry Pi 5 specific
    container_name: pid-annotator-web
    platform: linux/arm64
    ports:
      - "5001:5001"  # Port 5001 for both internal and external
    environment:
      - PORT=5001
      - GUNICORN_WORKERS=1  # Explicit for 4GB RAM model (use 2 for 8GB model)
      - FLASK_ENV=production
      - TZ=Europe/Copenhagen  # Adjust to your timezone
      - PYTHONUNBUFFERED=1
      # FOR RASPBERRY PI 5 8GB MODEL - Use these settings:
      # - GUNICORN_WORKERS=2
      # - mem_limit: 2560m
      # - mem_reservation: 768m
      # - cpus: 3.0
      # - tmpfs: /tmp:size=512M, /app/.cache:size=256M
    # All temporary storage in RAM (tmpfs) - no files written to disk
    tmpfs:
      - /tmp:size=384M,mode=1777
      - /app/.cache:size=192M,mode=755
      - /app/uploads:size=256M,mode=755,uid=1000,gid=1000
      - /app/output:size=256M,mode=755,uid=1000,gid=1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${PORT:-5001}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    # Optimized resource limits for Raspberry Pi 5 (4GB RAM)
    # For 4GB model: use mem_limit: 1792m, cpus: 2.5
    # For 8GB model: use mem_limit: 2560m, cpus: 3.0
    mem_limit: 1792m  # 1.75GB for 4GB Pi 5 (256MB headroom added)
    mem_reservation: 512m  # Minimum guaranteed memory
    cpus: 2.5  # Use 2.5 of 4 cores (leave 1.5 for system)
    # Logging configuration - prevent disk fill
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    networks:
      - pid_network
    # CasaOS specific labels
    labels:
      # App metadata
      net.casaos.app.name: "PID Annotator"
      net.casaos.app.version: "1.0"
      net.casaos.app.author: "Rudi S. Kærgaard"
      net.casaos.app.description: "Annotate P&ID PDF documents with Excel metadata"
      net.casaos.app.category: "Utilities"
      net.casaos.app.icon: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/pdf.png"
      # Port configuration
      net.casaos.app.web-port: "5001"
      net.casaos.app.protocol: "http"
      # Health check
      net.casaos.app.healthcheck: "http://localhost:5001/"

# Custom bridge network
networks:
  pid_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-pidannotator
