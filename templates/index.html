  <!-- Prevent theme flash: set dark class before CSS loads -->
  <script>
    (function () {
      try {
        const stored = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    })();
  </script>

<body class="bg-white text-gray-900 dark:bg-zinc-900 dark:text-zinc-100 transition-colors duration-500 ease-smooth">
  <div id="root" class="min-h-screen"></div>

  <script type="text/babel">
  {% raw %}
    const { useEffect, useMemo, useRef, useState } = React;

    // UI helpers
    function cx(...classes) {
      return classes.filter(Boolean).join(" ");
    }

    function ThemeToggle() {
      const [dark, setDark] = useState(() =>
        document.documentElement.classList.contains("dark")
      );

      useEffect(() => {
        if (dark) {
          document.documentElement.classList.add("dark");
          localStorage.setItem("theme", "dark");
        } else {
          document.documentElement.classList.remove("dark");
          localStorage.setItem("theme", "light");
        }
      }, [dark]);

      return (
        <button
          type="button"
          onClick={() => setDark((d) => !d)}
          className="inline-flex items-center gap-2 rounded-full bg-zinc-200/60 dark:bg-zinc-800 px-3 py-1.5 text-sm font-medium hover:scale-105 active:scale-95 transition-transform duration-200"
          aria-label="Toggle theme"
        >
          <i className={cx("fa-solid", dark ? "fa-moon" : "fa-sun")}></i>
          <span>{dark ? "Dark" : "Light"}</span>
        </button>
      );
    }

    function Header() {
      return (
        <header className="sticky top-0 z-30 backdrop-blur bg-white/70 dark:bg-zinc-900/70 border-b border-zinc-200/60 dark:border-zinc-800">
          <div className="mx-auto max-w-6xl px-4 sm:px-6">
            <div className="flex h-16 items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-brand/10 text-brand">
                  <i className="fa-solid fa-file-pdf text-lg"></i>
                </div>
                <div>
                  <div className="text-lg sm:text-xl font-semibold tracking-tight">
                    PID Annotator
                  </div>
                  <div className="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400">
                    Annotate PDF files using Excel data
                  </div>
                </div>
              </div>
              <ThemeToggle />
            </div>
          </div>
        </header>
      );
    }

    function SectionCard({ title, children, right }) {
      const [open, setOpen] = useState(true);
      return (
        <section className="rounded-xl bg-white dark:bg-zinc-950/60 border border-zinc-200/60 dark:border-zinc-800 shadow-soft">
          <button
            type="button"
            onClick={() => setOpen((o) => !o)}
            className="w-full flex items-center justify-between gap-3 px-4 sm:px-6 py-3 border-b border-zinc-200/60 dark:border-zinc-800"
            aria-expanded={open}
          >
            <div className="flex items-center gap-3">
              <i className={cx("fa-solid text-brand", open ? "fa-chevron-down rotate-0" : "fa-chevron-right rotate-0", "transition-transform duration-200")}></i>
              <h2 className="text-base sm:text-lg font-semibold">{title}</h2>
            </div>
        <div onClick={(e) => e.stopPropagation()}>{right}</div>
          </button>
          <div className={cx("grid transition-all duration-300", open ? "grid-rows-[1fr] opacity-100" : "grid-rows-[0fr] opacity-0")}>
            <div className="overflow-hidden">
              <div className="px-4 sm:px-6 py-4">{children}</div>
            </div>
          </div>
        </section>
      );
    }

    function UploadArea({ onFilesUploaded, onColumnsLoaded, uploadedFiles, setUploadedFiles, setToast }) {
      const inputRef = useRef(null);
      const [dragOver, setDragOver] = useState(false);
      const [status, setStatus] = useState(null); // {type: 'processing'|'success'|'error'|'warning', text: string}

      function logToConsole(message) {
        const timestamp = new Date().toLocaleTimeString();
        console.log(`[${timestamp}] ${message}`);
      }

      function setStatusMsg(type, text) {
        setStatus({ type, text });
      }

      function validateAndUpload(files) {
        if (!files || files.length === 0) return;

        setStatusMsg("processing", `Processing ${files.length} file(s)...`);
        logToConsole(`Processing ${files.length} files...`);

        const pdfFiles = files.filter((f) => f.name.toLowerCase().endsWith(".pdf"));
        const excelFiles = files.filter(
          (f) =>
            f.name.toLowerCase().endsWith(".xlsx") ||
            f.name.toLowerCase().endsWith(".xls")
        );
        const invalidFiles = files.filter(
          (f) =>
            !f.name.toLowerCase().endsWith(".pdf") &&
            !f.name.toLowerCase().endsWith(".xlsx") &&
            !f.name.toLowerCase().endsWith(".xls")
        );

        if (invalidFiles.length > 0) {
          setStatusMsg(
            "error",
            `Invalid file types: ${invalidFiles.map((f) => f.name).join(", ")}`
          );
          logToConsole(
            `Invalid file types: ${invalidFiles.map((f) => f.name).join(", ")}`
          );
          return;
        }

        const hasExcelInCurrentUpload = excelFiles.length > 0;
        const hasExcelAlreadyUploaded = uploadedFiles.excel.length > 0;

        logToConsole(
          `Debug: hasExcelInCurrentUpload=${hasExcelInCurrentUpload}, hasExcelAlreadyUploaded=${hasExcelAlreadyUploaded}, uploadedFiles.excel.length=${uploadedFiles.excel.length}`
        );

        if (excelFiles.length > 1) {
          setStatusMsg("error", "Please upload only one Excel file");
          logToConsole("Error: Multiple Excel files uploaded");
          return;
        }

        if (hasExcelInCurrentUpload && hasExcelAlreadyUploaded) {
          setStatusMsg(
            "error",
            "Excel file already uploaded. Please upload only PDF files now."
          );
          logToConsole("Error: Excel file already uploaded");
          return;
        }

        if (!hasExcelInCurrentUpload && !hasExcelAlreadyUploaded && pdfFiles.length > 0) {
          setStatusMsg("error", "Please upload at least one Excel file first");
          logToConsole(
            "Error: No Excel file uploaded, but trying to upload PDFs"
          );
          return;
        }

        if (!hasExcelInCurrentUpload && !hasExcelAlreadyUploaded && pdfFiles.length === 0) {
          setStatusMsg("error", "Please upload at least one Excel file");
          logToConsole("Error: No files to upload");
          return;
        }

        // If uploading a new Excel, clear previous lists
        if (hasExcelInCurrentUpload) {
          setUploadedFiles({ excel: [], pdf: [] });
        }

        const uploadPromises = [];
        if (hasExcelInCurrentUpload) {
          uploadPromises.push(uploadFile(excelFiles[0], "excel"));
        }
        pdfFiles.forEach((pdf) => uploadPromises.push(uploadFile(pdf, "pdf")));

        Promise.all(uploadPromises).then((results) => {
          const successful = results.filter((r) => r.success).length;
          const total = results.length;
          if (successful === total) {
            setStatusMsg("success", `${successful} file(s) uploaded successfully`);
            logToConsole(`Successfully uploaded ${successful} files`);
          } else {
            setStatusMsg(
              "warning",
              `${successful}/${total} files uploaded`
            );
            logToConsole(`Partial upload: ${successful}/${total} files uploaded`);
          }
          if (typeof onFilesUploaded === "function") onFilesUploaded();
        });
      }

      function uploadFile(file, type) {
        return new Promise((resolve) => {
          const formData = new FormData();
          formData.append(type === "pdf" ? "pdf_file" : "excel_file", file);
          logToConsole(`Uploading ${type.toUpperCase()}: ${file.name}`);

          fetch(type === "pdf" ? "/upload_pdf" : "/upload_excel", {
            method: "POST",
            body: formData,
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.success) {
                logToConsole(`${type.toUpperCase()} uploaded: ${data.filename}`);
                setUploadedFiles((prev) => {
                  const next = { ...prev };
                  next[type] = [...prev[type], { name: file.name, filename: data.filename }];
                  return next;
                });

                if (type === "excel" && data.columns && onColumnsLoaded) {
                  onColumnsLoaded(data.columns, data.default_tag_column);
                }

                resolve({ success: true, data });
              } else {
                logToConsole(`Error uploading ${type.toUpperCase()}: ${data.message}`);
                setToast({ type: "error", text: data.message });
                resolve({ success: false, data });
              }
            })
            .catch((error) => {
              logToConsole(`Error uploading ${type.toUpperCase()}: ${error.message}`);
              setToast({ type: "error", text: error.message });
              resolve({ success: false, error });
            });
        });
      }

      return (
        <div>
          <div
            onClick={() => inputRef.current?.click()}
            onDragOver={(e) => {
              e.preventDefault();
              setDragOver(true);
            }}
            onDragLeave={() => setDragOver(false)}
            onDrop={(e) => {
              e.preventDefault();
              setDragOver(false);
              const files = Array.from(e.dataTransfer.files || []);
              validateAndUpload(files);
            }}
            className={cx(
              "upload-area-tutorial group cursor-pointer rounded-2xl border-2 border-dashed p-8 sm:p-10 text-center transition-colors duration-300",
              "bg-white dark:bg-zinc-950/40 border-zinc-300/60 dark:border-zinc-700",
              "hover:border-brand/60 hover:bg-brand/5",
              dragOver && "border-brand bg-brand/10"
            )}
          >
            <div className="mx-auto flex h-16 w-16 items-center justify-center rounded-xl bg-brand/10 text-brand mb-3">
              <i className="fa-solid fa-file-arrow-up text-2xl"></i>
            </div>
            <div className="text-lg font-semibold">Click or drag files here.</div>
            <div className="text-sm text-zinc-500 dark:text-zinc-400">
              Upload one Excel first, then one or more PDF files
            </div>
            <div className="mt-2 text-xs text-zinc-400">
              Supported: PDF, Excel (.xlsx / .xls)
            </div>
            <input
              ref={inputRef}
              type="file"
              accept=".pdf,.xlsx,.xls"
              multiple
              className="hidden"
              onChange={(e) => {
                const files = Array.from(e.target.files || []);
                validateAndUpload(files);
                e.target.value = "";
              }}
            />
          </div>

          {status && (
            <div
              className={cx(
                "mt-3 inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs font-medium",
                status.type === "processing" &&
                  "bg-zinc-200/70 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300",
                status.type === "success" &&
                  "bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-300",
                status.type === "warning" &&
                  "bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300",
                status.type === "error" &&
                  "bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300"
              )}
            >
              {status.type === "processing" && <i className="fa-solid fa-spinner animate-spin"></i>}
              {status.type === "success" && <i className="fa-solid fa-check"></i>}
              {status.type === "warning" && <i className="fa-solid fa-triangle-exclamation"></i>}
              {status.type === "error" && <i className="fa-solid fa-xmark"></i>}
              <span>{status.text}</span>
            </div>
          )}
        </div>
      );
    }

    function FilesList({ uploadedFiles }) {
      const hasFiles =
        uploadedFiles.excel.length > 0 || uploadedFiles.pdf.length > 0;
      if (!hasFiles) return null;

      return (
        <div className="mt-6">
          <h3 className="text-sm font-semibold text-zinc-500 dark:text-zinc-400 mb-3">
            Uploaded Files
          </h3>
          <div className="grid gap-3 sm:grid-cols-2">
            {uploadedFiles.excel.map((f, idx) => (
              <div
                key={`excel-${idx}`}
                className="flex items-center gap-3 rounded-xl border border-zinc-200/60 dark:border-zinc-800 bg-white dark:bg-zinc-950/60 p-3"
              >
                <div className="flex h-10 w-10 items-center justify-center rounded-lg bg-emerald-500/10 text-emerald-500">
                  <i className="fa-solid fa-file-excel"></i>
                </div>
                <div className="flex-1">
                  <div className="text-sm font-medium">{f.name}</div>
                  <div className="text-xs text-zinc-500 dark:text-zinc-400">
                    Uploaded
                  </div>
                </div>
                <i className="fa-solid fa-check text-emerald-500"></i>
              </div>
            ))}
            {uploadedFiles.pdf.map((f, idx) => (
              <div
                key={`pdf-${idx}`}
                className="flex items-center gap-3 rounded-xl border border-zinc-200/60 dark:border-zinc-800 bg-white dark:bg-zinc-950/60 p-3"
              >
                <div className="flex h-10 w-10 items-center justify-center rounded-lg bg-rose-500/10 text-rose-500">
                  <i className="fa-solid fa-file-pdf"></i>
                </div>
                <div className="flex-1">
                  <div className="text-sm font-medium">{f.name}</div>
                  <div className="text-xs text-zinc-500 dark:text-zinc-400">
                    Uploaded
                  </div>
                </div>
                <i className="fa-solid fa-check text-emerald-500"></i>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // New FileWorkspace component
    function FileWorkspace({ workspaceFiles, selectedPdfs, selectedExcel, onSelectionChange, onExcelSelectionChange, onDeleteFile, onUploadFiles, onColumnsLoaded, setToast, onRefresh }) {
      const inputRef = useRef(null);
      const [dragOver, setDragOver] = useState(false);

      function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
      }

      function handleFileUpload(files) {
        if (!files || files.length === 0) return;

        const pdfFiles = files.filter((f) => f.name.toLowerCase().endsWith(".pdf"));
        const excelFiles = files.filter(
          (f) =>
            f.name.toLowerCase().endsWith(".xlsx") ||
            f.name.toLowerCase().endsWith(".xls") ||
            f.name.toLowerCase().endsWith(".csv")
        );

        // Multiple Excel files are now allowed - users can select which one to use

        // Upload files
        const uploadPromises = [];
        excelFiles.forEach((file) => uploadPromises.push(uploadFile(file, "excel")));
        pdfFiles.forEach((file) => uploadPromises.push(uploadFile(file, "pdf")));

        Promise.all(uploadPromises).then(() => {
          onRefresh();
        });
      }

      function uploadFile(file, type) {
        return new Promise((resolve) => {
          const formData = new FormData();
          formData.append(type === "pdf" ? "pdf_file" : "excel_file", file);

          fetch(type === "pdf" ? "/upload_pdf" : "/upload_excel", {
            method: "POST",
            body: formData,
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.success) {
                if (type === "excel" && data.columns && onColumnsLoaded) {
                  onColumnsLoaded(data.columns, data.default_tag_column);
                }
                setToast({ type: "success", text: `${file.name} uploaded successfully` });
                resolve({ success: true });
              } else {
                setToast({ type: "error", text: data.message });
                resolve({ success: false });
              }
            })
            .catch((error) => {
              setToast({ type: "error", text: error.message });
              resolve({ success: false });
            });
        });
      }

      function handleDeleteFile(filename) {
        if (!confirm(`Delete ${filename}?`)) return;

        fetch("/delete_file", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename })
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success) {
              setToast({ type: "success", text: "File deleted" });

              // Clear selectedExcel if the deleted file was selected
              if (selectedExcel === filename) {
                onExcelSelectionChange(null);
              }

              onRefresh();
            } else {
              setToast({ type: "error", text: data.message });
            }
          })
          .catch((err) => {
            setToast({ type: "error", text: `Error: ${err.message}` });
          });
      }

      function togglePdfSelection(filename) {
        const newSelection = selectedPdfs.includes(filename)
          ? selectedPdfs.filter(f => f !== filename)
          : [...selectedPdfs, filename];
        onSelectionChange(newSelection);
      }

      function selectAllPdfs() {
        onSelectionChange(workspaceFiles.pdfs.map(f => f.filename));
      }

      function deselectAllPdfs() {
        onSelectionChange([]);
      }

      function toggleExcelSelection(filename) {
        // Single selection: if clicking on already selected, do nothing
        // if clicking on different file, switch to that one
        if (selectedExcel === filename) {
          // Already selected, keep it selected (don't allow deselection)
          return;
        }
        onExcelSelectionChange(filename);

        // Update session and reload columns for the newly selected Excel file
        fetch("/select_excel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ excel_file: filename, header_row: 6 })
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success && onColumnsLoaded) {
              onColumnsLoaded(data.columns, data.default_tag_column);
              setToast({ type: "success", text: `Switched to ${filename.split('_').slice(1).join('_')}` });
            } else {
              setToast({ type: "error", text: data.message || "Failed to load columns" });
            }
          })
          .catch((err) => {
            console.error("Error reloading columns:", err);
            setToast({ type: "error", text: "Failed to switch Excel file" });
          });
      }

      const totalFiles = workspaceFiles.excel.length + workspaceFiles.pdfs.length;
      const selectedCount = selectedPdfs.length;

      return (
        <div className="space-y-4">
          {/* Upload Drop Zone */}
          <div
            onClick={() => inputRef.current?.click()}
            onDragOver={(e) => {
              e.preventDefault();
              setDragOver(true);
            }}
            onDragLeave={() => setDragOver(false)}
            onDrop={(e) => {
              e.preventDefault();
              setDragOver(false);
              const files = Array.from(e.dataTransfer.files || []);
              handleFileUpload(files);
            }}
            className={cx(
              "cursor-pointer rounded-xl border-2 border-dashed p-6 text-center transition-colors duration-300",
              "bg-white dark:bg-zinc-950/40 border-zinc-300/60 dark:border-zinc-700",
              "hover:border-brand/60 hover:bg-brand/5",
              dragOver && "border-brand bg-brand/10"
            )}
          >
            <div className="flex items-center justify-center gap-3">
              <i className="fa-solid fa-cloud-arrow-up text-2xl text-brand"></i>
              <div className="text-sm font-medium">Drop files here or click to upload</div>
              <div className="text-xs text-zinc-500 dark:text-zinc-400">(PDF, Excel, CSV)</div>
            </div>
            <input
              ref={inputRef}
              type="file"
              accept=".pdf,.xlsx,.xls,.csv"
              multiple
              className="hidden"
              onChange={(e) => {
                const files = Array.from(e.target.files || []);
                handleFileUpload(files);
                e.target.value = "";
              }}
            />
          </div>

          {/* Workspace Header */}
          {totalFiles > 0 && (
            <div className="flex items-center justify-between gap-3">
              <div className="text-sm font-semibold text-zinc-700 dark:text-zinc-300">
                Workspace ({totalFiles} file{totalFiles !== 1 ? 's' : ''})
                {selectedCount > 0 && (
                  <span className="ml-2 text-brand">
                    {selectedCount} PDF{selectedCount !== 1 ? 's' : ''} selected
                  </span>
                )}
              </div>
              <div className="flex gap-2">
                {workspaceFiles.pdfs.length > 0 && (
                  <>
                    {selectedPdfs.length === workspaceFiles.pdfs.length ? (
                      <button
                        onClick={deselectAllPdfs}
                        className="text-xs px-3 py-1.5 rounded-lg bg-zinc-200/60 dark:bg-zinc-800 hover:bg-zinc-300/60 dark:hover:bg-zinc-700 transition-colors"
                      >
                        Deselect All
                      </button>
                    ) : (
                      <button
                        onClick={selectAllPdfs}
                        className="text-xs px-3 py-1.5 rounded-lg bg-brand/10 text-brand hover:bg-brand/20 transition-colors"
                      >
                        Select All PDFs
                      </button>
                    )}
                  </>
                )}
                <button
                  onClick={() => {
                    if (confirm('Clear all files from workspace?')) {
                      fetch('/clear_session', { method: 'POST' })
                        .then(r => r.json())
                        .then(data => {
                          if (data.success) {
                            setToast({ type: 'success', text: 'Workspace cleared' });
                            onRefresh();
                          }
                        });
                    }
                  }}
                  className="text-xs px-3 py-1.5 rounded-lg bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300 hover:bg-red-200 dark:hover:bg-red-900/50 transition-colors"

    function TutorialTooltip({ step, currentStep, totalSteps, onNext, onPrev, onSkip, onComplete }) {
      if (!step) return null;

      const isFirst = currentStep === 1;
      const isLast = currentStep === totalSteps;
      const tooltipRef = React.useRef(null);
      const [tooltipStyle, setTooltipStyle] = React.useState({});
      const [arrowStyle, setArrowStyle] = React.useState({});
      const [arrowPosition, setArrowPosition] = React.useState('top');

      // Calculate tooltip position based on target element
      useEffect(() => {
        if (!step?.target || !tooltipRef.current) return;

        const targetElement = document.querySelector(step.target);
        if (!targetElement) return;

        const targetRect = targetElement.getBoundingClientRect();
        const tooltipRect = tooltipRef.current.getBoundingClientRect();
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const padding = 16;
        const arrowSize = 12;

        let top, left, arrowPos = 'top', arrowLeft = '50%', arrowTop = '-12px';

        // Determine best position based on step.position and available space
        const position = step.position || 'bottom';

        if (position === 'bottom') {
          top = targetRect.bottom + arrowSize + padding;
          left = targetRect.left + (targetRect.width / 2) - (tooltipRect.width / 2);
          arrowPos = 'top';
          arrowTop = '-12px';
          arrowLeft = '50%';
        } else if (position === 'top') {
          top = targetRect.top - tooltipRect.height - arrowSize - padding;
          left = targetRect.left + (targetRect.width / 2) - (tooltipRect.width / 2);
          arrowPos = 'bottom';
          arrowTop = 'auto';
          arrowLeft = '50%';
        } else if (position === 'right') {
          top = targetRect.top + (targetRect.height / 2) - (tooltipRect.height / 2);
          left = targetRect.right + arrowSize + padding;
          arrowPos = 'left';
          arrowTop = '50%';
          arrowLeft = '-12px';
        } else if (position === 'left') {
          top = targetRect.top + (targetRect.height / 2) - (tooltipRect.height / 2);
          left = targetRect.left - tooltipRect.width - arrowSize - padding;
          arrowPos = 'right';
          arrowTop = '50%';
          arrowLeft = 'auto';
        }

        // Adjust if tooltip goes off screen
        if (left < padding) left = padding;
        if (left + tooltipRect.width > viewportWidth - padding) {
          left = viewportWidth - tooltipRect.width - padding;
        }
        if (top < padding) top = padding;
        if (top + tooltipRect.height > viewportHeight - padding) {
          top = viewportHeight - tooltipRect.height - padding;
        }

        setTooltipStyle({ top: `${top}px`, left: `${left}px` });
        setArrowPosition(arrowPos);
        setArrowStyle({
          top: arrowTop === 'auto' ? 'auto' : arrowTop,
          bottom: arrowPos === 'bottom' ? '-12px' : 'auto',
          left: arrowLeft === 'auto' ? 'auto' : arrowLeft,
          right: arrowPos === 'right' ? '-12px' : 'auto',
          transform: arrowLeft === '50%' || arrowTop === '50%' ? 'translate(-50%, -50%)' : 'none'
        });
      }, [step, currentStep]);

      return (
        <div
          ref={tooltipRef}
          className="tutorial-tooltip fixed z-[60] bg-white dark:bg-zinc-900 border-2 border-brand rounded-xl shadow-soft p-4 max-w-sm transition-all duration-300"
          style={tooltipStyle}
        >
          {/* Arrow pointer */}
          <div
            className="absolute w-0 h-0"
            style={{
              ...arrowStyle,
              borderLeft: arrowPosition === 'right' ? '12px solid transparent' : arrowPosition === 'left' ? '12px solid var(--color-brand)' : '12px solid transparent',
              borderRight: arrowPosition === 'left' ? '12px solid transparent' : arrowPosition === 'right' ? '12px solid var(--color-brand)' : '12px solid transparent',
              borderTop: arrowPosition === 'bottom' ? '12px solid transparent' : arrowPosition === 'top' ? '12px solid var(--color-brand)' : '12px solid transparent',
              borderBottom: arrowPosition === 'top' ? '12px solid transparent' : arrowPosition === 'bottom' ? '12px solid var(--color-brand)' : '12px solid transparent',
            }}
          />
          <div className="flex items-start justify-between mb-3">
            <div className="flex-1">
              <h4 className="font-semibold text-lg text-brand">{step.title}</h4>
              <div className="text-xs text-zinc-500 dark:text-zinc-400 mt-1">
                Step {currentStep} of {totalSteps}
              </div>
            </div>
            <button
              onClick={onSkip}
              className="rounded-lg p-1 hover:bg-zinc-200/60 dark:hover:bg-zinc-800"
              aria-label="Close tutorial"
            >
              <i className="fa-solid fa-xmark"></i>
            </button>
          </div>

          <p className="text-sm text-zinc-700 dark:text-zinc-300 mb-4">
            {step.content}
          </p>

          <div className="flex items-center justify-between">
            <div className="flex gap-1">
              {Array.from({ length: totalSteps }).map((_, i) => (
                <div
                  key={i}
                  className={cx(
                    "w-2 h-2 rounded-full transition-colors",
                    i + 1 === currentStep
                      ? "bg-brand"
                      : i + 1 < currentStep
                      ? "bg-brand/50"
                      : "bg-zinc-300 dark:bg-zinc-700"
                  )}
                />
              ))}
            </div>

            <div className="flex gap-2">
              {!isFirst && (
                <button
                  onClick={onPrev}
                  className="rounded-lg bg-zinc-200/80 dark:bg-zinc-800 px-3 py-1.5 text-sm font-medium hover:bg-zinc-300/70 dark:hover:bg-zinc-700 transition-colors"
                >
                  <i className="fa-solid fa-arrow-left mr-1"></i>
                  Back
                </button>
              )}
              {!isLast ? (
                <button
                  onClick={onNext}
                  className="rounded-lg bg-brand text-white px-3 py-1.5 text-sm font-medium hover:bg-brand-hover transition-colors"
                >
                  Next
                  <i className="fa-solid fa-arrow-right ml-1"></i>

              ) : (
                <button
                  onClick={onComplete}
                  className="rounded-lg bg-success text-white px-3 py-1.5 text-sm font-medium hover:bg-success-hover transition-colors"
                >
                  <i className="fa-solid fa-check mr-1"></i>
                  Finish
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function TutorialOverlay({ active, currentStep, onNext, onPrev, onSkip, onComplete }) {
      if (!active) return null;

      const step = tutorialSteps[currentStep - 1];
      const [spotlightStyle, setSpotlightStyle] = React.useState({});

      useEffect(() => {
        // Scroll to target element
        if (step?.target) {
          const element = document.querySelector(step.target);
          if (element) {
            element.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Calculate spotlight position
            setTimeout(() => {
              const rect = element.getBoundingClientRect();
              const padding = 8;
              setSpotlightStyle({
                top: `${rect.top - padding}px`,
                left: `${rect.left - padding}px`,
                width: `${rect.width + padding * 2}px`,
                height: `${rect.height + padding * 2}px`,
              });
            }, 100);
          }
        }
      }, [currentStep, step?.target]);

      // Keyboard navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight' || e.key === 'Enter') {
            e.preventDefault();
            onNext();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            onPrev();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            onSkip();
          }
        };

        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [onNext, onPrev, onSkip]);

      return (
        <>
          <div className="tutorial-backdrop fixed inset-0 z-[55] bg-black/40 dark:bg-black/60" />

          {/* Animated spotlight effect */}
          {step?.target && (
            <div
              className="tutorial-spotlight fixed z-[56] rounded-lg border-2 border-brand shadow-[0_0_0_9999px_rgba(0,0,0,0.3)] pointer-events-none transition-all duration-300 ease-out"
              style={{
                ...spotlightStyle,
                boxShadow: '0 0 0 9999px rgba(0, 0, 0, 0.3), 0 0 20px 4px rgba(var(--color-brand-rgb), 0.5), inset 0 0 20px rgba(var(--color-brand-rgb), 0.2)',
                animation: 'pulse-spotlight 2s ease-in-out infinite'
              }}
            />
          )}

          <TutorialTooltip
            step={step}
            currentStep={currentStep}
            totalSteps={tutorialSteps.length}
            onNext={onNext}
            onPrev={onPrev}
            onSkip={onSkip}
            onComplete={onComplete}
          />

          {/* Keyboard hints */}
          <div className="fixed bottom-4 right-4 z-[60] bg-white/90 dark:bg-zinc-900/90 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-xs text-zinc-600 dark:text-zinc-400 backdrop-blur-sm">
            <div className="flex items-center gap-3">
              <span className="flex items-center gap-1">
                <kbd className="px-1.5 py-0.5 bg-zinc-200 dark:bg-zinc-800 rounded text-[10px] font-mono">←</kbd>
                <kbd className="px-1.5 py-0.5 bg-zinc-200 dark:bg-zinc-800 rounded text-[10px] font-mono">→</kbd>
                Navigate
              </span>
              <span className="flex items-center gap-1">
                <kbd className="px-1.5 py-0.5 bg-zinc-200 dark:bg-zinc-800 rounded text-[10px] font-mono">ESC</kbd>
                Skip
              </span>
            </div>
          </div>
        </>
      );
    }

    function App() {

      // Workspace state
      const [workspaceFiles, setWorkspaceFiles] = useState({ excel: [], pdfs: [] });

      const [tagColumn, setTagColumn] = useState("");

      const [highlightColor, setHighlightColor] = useState("#FFFF00");
      const [highlightColumn, setHighlightColumn] = useState("");

      const [watermarkTextColor, setWatermarkTextColor] = useState("#000000");

      // Profile management state
      const [builtinTemplates, setBuiltinTemplates] = useState([]);
      const [savedProfiles, setSavedProfiles] = useState([]);
      const [selectedProfile, setSelectedProfile] = useState("");
      const [activeProfileName, setActiveProfileName] = useState("");
      const [showSaveProfileModal, setShowSaveProfileModal] = useState(false);
      const [showImportProfileModal, setShowImportProfileModal] = useState(false);

      // Tutorial state
      const [tutorialActive, setTutorialActive] = useState(false);
      const [tutorialStep, setTutorialStep] = useState(1);

      // UI state
      const [showFAQ, setShowFAQ] = useState(false);
      const [toast, setToast] = useState(null); // {type, text}

      // Processing modal state
      const [processingOpen, setProcessingOpen] = useState(false);
      const [processingTitle, setProcessingTitle] = useState("Processing Files");
      const [progress, setProgress] = useState(0);
      const [statusText, setStatusText] = useState("Initializing...");
      const [fileCount, setFileCount] = useState(0);
      const [errorText, setErrorText] = useState(null);
      const [currentTaskId, setCurrentTaskId] = useState(null);
      const [annotateExcelEnabled, setAnnotateExcelEnabled] = useState(false);
      const [isCurrentTestRun, setIsCurrentTestRun] = useState(false);

      // Socket
      const socket = useMemo(() => io(), []);
      const pollRef = useRef(null);

      function logToConsole(message) {
        const timestamp = new Date().toLocaleTimeString();
        console.log(`[${timestamp}] ${message}`);
      }

      function onColumnsLoaded(columns, defaultTag) {
        setExcelColumns(columns || []);
        setTagColumn(defaultTag || "");
        // Reset dependent fields
        setWatermarkAttributes([]);
        setHighlightColumn("");
        // Default: no columns selected for comments
        setCommentColumns([]);
        logToConsole(`Loaded ${columns?.length ?? 0} columns from Excel file`);
      }

      function reloadColumnsForHeaderRow(nextHeaderRow) {
        fetch("/reload_columns", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ header_row: nextHeaderRow }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              onColumnsLoaded(data.columns, data.default_tag_column);
              logToConsole(data.message || "Columns reloaded");
            } else {
              setToast({ type: "error", text: data.message || "Failed to reload columns" });
              logToConsole(`Error reloading columns: ${data.message}`);
            }
          })
          .catch((err) => {
            setToast({ type: "error", text: err.message });
            logToConsole(`Error reloading columns: ${err.message}`);
          });
      }

      function startProcessing(isTest) {
        // Validate that files are selected
        if (selectedPdfs.length === 0) {
          setToast({ type: "error", text: "Please select at least one PDF file to process" });
          return;
        }

        if (!selectedExcel) {
          setToast({ type: "error", text: "Please select an Excel/CSV file from the workspace" });
          return;
        }

        setProcessingOpen(true);
        setProcessingTitle(isTest ? "Test Run (100 tags)" : "Processing Files");
        setProgress(0);
        setStatusText("Initializing...");
        setErrorText(null);
        setFileCount(0);
        setIsCurrentTestRun(isTest);

        const data = {
          header_row: Number(headerRow) || 1,
          tag_column: tagColumn || "",
          comment_columns: commentColumns.length > 0 ? commentColumns : null,
          highlight_color: highlightColor,
          highlight_column: highlightColumn,
          annotate_excel: annotateExcel,
          watermark_enabled: watermarkEnabled,
          watermark_attributes: watermarkAttributes,
          watermark_text_color: watermarkTextColor,
          max_tags: isTest ? 100 : null,
          is_test: isTest,
          selected_pdfs: selectedPdfs,  // Send selected PDF filenames
          selected_excel: selectedExcel,  // Send selected Excel filename
        };

        logToConsole(isTest ? `Starting test run (100 tags) with ${selectedPdfs.length} PDF(s)...` : `Starting full processing with ${selectedPdfs.length} PDF(s)...`);

        fetch("/process", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              setCurrentTaskId(data.task_id);
              setFileCount(data.file_count || 0);
              logToConsole(`Processing started with task ID: ${data.task_id}`);
              startProgressPolling(data.task_id);
            } else {
              setErrorText(data.message || "Failed to start processing");
              setStatusText("Error starting processing");
              logToConsole(`Error starting processing: ${data.message}`);
            }
          })
          .catch((err) => {
            setErrorText(err.message);
            setStatusText("Error starting processing");
            logToConsole(`Error starting processing: ${err.message}`);
          });
      }

      function startProgressPolling(taskId) {
        if (pollRef.current) {
          clearInterval(pollRef.current);
        }
        pollRef.current = setInterval(() => {
          fetch(`/progress/${taskId}`)
            .then((r) => r.json())
            .then((data) => {
              if (typeof data.progress === "number" && data.progress >= 0) {
                setProgress(data.progress);
                setStatusText(data.status || "");
              }
              if (data.progress === 100) {
                // Extract file count from status if present
                const statusMessage = data.status || "";
                const fileCountMatch = statusMessage.match(/(\d+)\s+PDF\(s\)/);
                const count = fileCountMatch ? parseInt(fileCountMatch[1], 10) : fileCount || 1;
                setFileCount(count);
                clearInterval(pollRef.current);
                pollRef.current = null;
                logToConsole("Processing complete! (detected via polling)");
              } else if (data.progress === -1) {
                setErrorText(data.status || "Processing failed");
                clearInterval(pollRef.current);
                pollRef.current = null;
                logToConsole(`Error detected via polling: ${data.status}`);
              }
            })
            .catch((err) => {
              logToConsole(`Error polling progress: ${err.message}`);
            });
        }, 2000);
      }

      // Profile Management Functions
      function loadProfilesAndTemplates() {
        // Load built-in templates
        fetch("/get_builtin_templates")
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              setBuiltinTemplates(data.templates || []);
              logToConsole(`Loaded ${data.templates?.length || 0} built-in templates`);
            }
          })
          .catch((err) => {
            logToConsole(`Error loading templates: ${err.message}`);
          });

        // Load saved profiles
        fetch("/load_profiles")
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              setSavedProfiles(data.profiles || []);
              logToConsole(`Loaded ${data.count || 0} saved profiles`);
            }
          })
          .catch((err) => {
            logToConsole(`Error loading profiles: ${err.message}`);
          });
      }

      function applyProfileSettings(settings) {
        // Apply all settings from profile
        if (settings.header_row !== undefined) setHeaderRow(settings.header_row);
        if (settings.tag_column !== undefined && settings.tag_column !== null) setTagColumn(settings.tag_column);
        if (settings.comment_columns !== undefined) setCommentColumns(settings.comment_columns);
        if (settings.highlight_column !== undefined) setHighlightColumn(settings.highlight_column);
        if (settings.highlight_color !== undefined) setHighlightColor(settings.highlight_color);
        if (settings.annotate_excel !== undefined) setAnnotateExcel(settings.annotate_excel);
        if (settings.watermark_enabled !== undefined) setWatermarkEnabled(settings.watermark_enabled);
        if (settings.watermark_attributes !== undefined) setWatermarkAttributes(settings.watermark_attributes);
        if (settings.watermark_text_color !== undefined) setWatermarkTextColor(settings.watermark_text_color);
      }

      function loadSelectedProfile() {
        if (!selectedProfile) {
          setToast({ type: "warning", text: "No profile selected" });
          return;
        }

        if (selectedProfile.startsWith('template:')) {
          // Load built-in template
          const templateName = selectedProfile.replace('template:', '');
          const template = builtinTemplates.find(t => t.name === templateName);
          if (template) {
            applyProfileSettings(template.settings);
            setActiveProfileName(template.name);
            setToast({ type: "success", text: `Template "${template.name}" loaded` });
            logToConsole(`Loaded template: ${template.name}`);
          }
        } else if (selectedProfile.startsWith('profile:')) {
          // Load saved profile
          const filename = selectedProfile.replace('profile:', '');
          fetch(`/load_profile/${filename}`)
            .then((r) => r.json())
            .then((data) => {
              if (data.success) {
                applyProfileSettings(data.profile.settings);
                setActiveProfileName(data.profile.name);
                setToast({ type: "success", text: `Profile "${data.profile.name}" loaded` });
                logToConsole(`Loaded profile: ${data.profile.name}`);
              } else {
                setToast({ type: "error", text: data.message });
              }
            })
            .catch((err) => {
              setToast({ type: "error", text: err.message });
            });
        }
      }

      function saveCurrentProfile(name, description) {
        const profileData = {
          name: name,
          description: description,
          settings: {
            header_row: headerRow,
            tag_column: tagColumn,
            comment_columns: commentColumns,
            highlight_column: highlightColumn,
            highlight_color: highlightColor,
            annotate_excel: annotateExcel,
            watermark_enabled: watermarkEnabled,
            watermark_attributes: watermarkAttributes,
            watermark_text_color: watermarkTextColor
          }
        };

        fetch("/save_profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(profileData)
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              setToast({ type: "success", text: data.message });
              logToConsole(`Saved profile: ${name}`);
              loadProfilesAndTemplates(); // Reload profiles list
              setActiveProfileName(name);
              setShowSaveProfileModal(false);
            } else {
              setToast({ type: "error", text: data.message });
            }
          })
          .catch((err) => {
            setToast({ type: "error", text: err.message });
          });
      }

      function exportSelectedProfile() {
        if (!selectedProfile || selectedProfile.startsWith('template:')) {
          setToast({ type: "warning", text: "Cannot export built-in templates" });
          return;
        }

        const profileData = savedProfiles.find(p => p.filename === selectedProfile.replace('profile:', ''));
        if (!profileData) return;

        fetch("/export_profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: profileData.name })
        })
          .then((response) => {
            if (response.ok) {
              return response.blob();
            } else {
              return response.json().then(data => {
                throw new Error(data.message || 'Export failed');
              });
            }
          })
          .then((blob) => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${profileData.name}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            setToast({ type: "success", text: "Profile exported successfully" });
            logToConsole(`Exported profile: ${profileData.name}`);
          })
          .catch((err) => {
            setToast({ type: "error", text: err.message });
          });
      }

      function importProfileFile(file) {
        const formData = new FormData();
        formData.append('profile_file', file);

        fetch("/import_profile", {
          method: "POST",
          body: formData
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              setToast({ type: "success", text: data.message });
              logToConsole(`Imported profile: ${data.profile.name}`);
              loadProfilesAndTemplates(); // Reload profiles list
              setShowImportProfileModal(false);
            } else {
              setToast({ type: "error", text: data.message });
            }
          })
          .catch((err) => {
            setToast({ type: "error", text: err.message });
          });
      }

      function deleteSelectedProfile() {
        if (!selectedProfile || selectedProfile.startsWith('template:')) {
          setToast({ type: "warning", text: "Cannot delete built-in templates" });
          return;
        }

        const filename = selectedProfile.replace('profile:', '');
        const profileData = savedProfiles.find(p => p.filename === filename);

        if (!confirm(`Are you sure you want to delete profile "${profileData?.name || filename}"?`)) {
          return;
        }

        fetch(`/delete_profile/${filename}`, {
          method: "DELETE"
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              setToast({ type: "success", text: data.message });
              logToConsole(`Deleted profile: ${filename}`);
              setSelectedProfile("");
              if (activeProfileName === profileData?.name) {
                setActiveProfileName("");
              }
              loadProfilesAndTemplates(); // Reload profiles list
            } else {
              setToast({ type: "error", text: data.message });
            }
          })
          .catch((err) => {
            setToast({ type: "error", text: err.message });
          });
      }

      // Tutorial control functions
      function startTutorial() {
        setTutorialActive(true);
        setTutorialStep(1);
        localStorage.setItem('tutorial_started', 'true');
      }

      function nextTutorialStep() {
        if (tutorialStep < tutorialSteps.length) {
          setTutorialStep(tutorialStep + 1);
        }
      }

      function prevTutorialStep() {
        if (tutorialStep > 1) {
          setTutorialStep(tutorialStep - 1);
        }
      }

      function skipTutorial() {
        setTutorialActive(false);
        setTutorialStep(1);
        localStorage.setItem('tutorial_completed', 'true');
        const dismissCount = parseInt(localStorage.getItem('tutorial_dismissed_count') || '0');
        localStorage.setItem('tutorial_dismissed_count', String(dismissCount + 1));
      }

      function completeTutorial() {
        setTutorialActive(false);
        setTutorialStep(1);
        localStorage.setItem('tutorial_completed', 'true');
        setToast({ type: 'success', text: 'Tutorial completed! You\'re ready to start annotating PDFs.' });
      }

      // Workspace functions
      function refreshWorkspace() {
        fetch("/list_workspace_files")
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              setWorkspaceFiles(data.files);
              logToConsole(`Workspace refreshed: ${data.total} files`);

              // Auto-select all PDFs if none are selected yet
              if (selectedPdfs.length === 0 && data.files.pdfs.length > 0) {
                setSelectedPdfs(data.files.pdfs.map(f => f.filename));
              }

              // Auto-select first Excel file if none is selected yet
              if (!selectedExcel && data.files.excel.length > 0) {
                const firstExcel = data.files.excel[0].filename;
                setSelectedExcel(firstExcel);
                logToConsole(`Auto-selected Excel file: ${data.files.excel[0].name}`);

                // Load columns for the auto-selected Excel file
                fetch("/select_excel", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ excel_file: firstExcel, header_row: 6 })
                })
                  .then((r) => r.json())
                  .then((colData) => {
                    if (colData.success) {
                      onColumnsLoaded(colData.columns, colData.default_tag_column);
                    }
                  })
                  .catch((err) => {
                    console.error("Error loading columns for auto-selected Excel:", err);
                  });
              }
            } else {
              logToConsole(`Error refreshing workspace: ${data.message}`);
            }
          })
          .catch((err) => {
            logToConsole(`Error refreshing workspace: ${err.message}`);
          });
      }

      function addOutputsToWorkspace(outputFiles) {
        if (!outputFiles || outputFiles.length === 0) return;

        fetch("/add_outputs_to_workspace", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ output_files: outputFiles })
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              logToConsole(`Added ${data.moved_files.length} PDFs to workspace`);
              refreshWorkspace();
            } else {
              logToConsole(`Error adding outputs to workspace: ${data.message}`);
            }
          })
          .catch((err) => {
            logToConsole(`Error adding outputs to workspace: ${err.message}`);
          });
      }

      // Load workspace files on mount
      useEffect(() => {
        refreshWorkspace();
      }, []);

      // Check for first-time user on mount
      useEffect(() => {
        const tutorialCompleted = localStorage.getItem('tutorial_completed');
        const dismissCount = parseInt(localStorage.getItem('tutorial_dismissed_count') || '0');

        // Auto-start tutorial for first-time users (not completed and dismissed < 3 times)
        if (!tutorialCompleted && dismissCount < 3) {
          // Delay to let page render
          setTimeout(() => {
            startTutorial();
          }, 1000);
        }
      }, []);

      // Load profiles and templates on mount
      useEffect(() => {
        loadProfilesAndTemplates();
      }, []);

      // Socket listeners
      useEffect(() => {
        function onConnect() {
          logToConsole("Connected to server");
        }
        function onDisconnect() {
          logToConsole("Disconnected from server");
        }
        function onConnectError(error) {
          logToConsole("Connection error: " + error);
        }
        function onProgress(data) {
          logToConsole(
            `[DEBUG] Received progress update: task_id=${data.task_id}, progress=${data.progress}, status=${data.status}`
          );
          if (data.task_id === currentTaskId) {
            if (typeof data.progress === "number" && data.progress >= 0) {
              setProgress(data.progress);
              setStatusText(data.status || "");
              if (data.progress === 100) {
                const statusMessage = data.status || "";
                const fileCountMatch = statusMessage.match(/(\d+)\s+PDF\(s\)/);
                const count = fileCountMatch ? parseInt(fileCountMatch[1], 10) : fileCount || 1;
                setFileCount(count);
                logToConsole("Processing complete! Download is now available!");

                // Get output files from server and add PDFs to workspace
                fetch("/download")
                  .then((r) => r.json())
                  .then((data) => {
                    if (data && data.success) {
                      // Extract output files info
                      const outputFiles = data.output_files || [];
                      logToConsole(`Processing completed with ${outputFiles.length} output files`);

                      // Add PDF outputs to workspace (Excel outputs are download-only)
                      if (outputFiles.length > 0) {
                        addOutputsToWorkspace(outputFiles);
                      }
                    }
                  })
                  .catch((err) => {
                    logToConsole(`Error fetching output files: ${err.message}`);
                  });
              }
            } else {
              setErrorText(data.status || "Processing failed");
              logToConsole(`Error: ${data.status}`);
            }
          }
        }

        socket.on("connect", onConnect);
        socket.on("disconnect", onDisconnect);
        socket.on("connect_error", onConnectError);
        socket.on("progress_update", onProgress);

        return () => {
          socket.off("connect", onConnect);
          socket.off("disconnect", onDisconnect);
          socket.off("connect_error", onConnectError);
          socket.off("progress_update", onProgress);
        };
      }, [socket, currentTaskId, fileCount]);

      function closeProcessing() {
        setProcessingOpen(false);
        setErrorText(null);
        setProgress(0);
        setStatusText("Initializing...");
        if (pollRef.current) {
          clearInterval(pollRef.current);
          pollRef.current = null;
        }
      }

      function downloadFromModal() {
        logToConsole("Starting download from modal...");
        fetch("/download")
          .then((r) => r.json())
          .then((data) => {
            logToConsole(`[DEBUG] Download JSON response: ${JSON.stringify(data)}`);

            if (data.success && Array.isArray(data.files)) {
              logToConsole(`Starting download of ${data.file_count || data.files.length} files...`);
              logToConsole(`[DEBUG] File URLs: ${JSON.stringify(data.files)}`);
              sequentialDownloads(data.files);
            } else {
              logToConsole(`Download error: ${data.message}`);
              setToast({ type: "error", text: data.message || "Download error" });
            }
          })
          .catch((err) => {
            logToConsole(`Download error: ${err.message}`);
            setToast({ type: "error", text: `Download failed: ${err.message}` });
          });
      }

      function sequentialDownloads(urls) {
        let i = 0;
        function next() {
          if (i < urls.length) {
            const a = document.createElement("a");
            a.href = urls[i];
            a.download = "";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            i += 1;
            setTimeout(next, 1000);
          } else {
            logToConsole("All files downloaded successfully!");
            // Trigger cleanup after all downloads complete
            cleanupAfterDownload();
          }
        }
        next();
      }

      function cleanupAfterDownload() {
        logToConsole("Starting post-download cleanup...");

        // Determine cleanup type based on whether this was a test run
        const isTestCleanup = isCurrentTestRun;

        fetch("/cleanup_after_download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              const deletedCount = (data.deleted_uploads || 0) + (data.deleted_outputs || 0);

              if (isTestCleanup) {
                logToConsole(`Test cleanup successful: deleted ${data.deleted_outputs} test output(s). Uploads preserved.`);
                setToast({
                  type: "success",
                  text: `Test files downloaded! Upload data preserved. Ready for full run.`
                });
                // For test runs, only close the modal - workspace already has files
                closeProcessing();
                refreshWorkspace();
              } else {
                logToConsole(`Full cleanup successful: deleted ${data.deleted_outputs} Excel output(s). PDFs remain in workspace.`);
                setToast({
                  type: "success",
                  text: `Files downloaded! Annotated PDFs added to workspace for reprocessing.`
                });
                // For full runs, files remain in workspace - just close modal
                closeProcessing();
                refreshWorkspace();
              }
            } else {
              logToConsole(`Cleanup error: ${data.message}`);
              setToast({ type: "error", text: `Cleanup failed: ${data.message}` });
            }
          })
          .catch((err) => {
            logToConsole(`Cleanup error: ${err.message}`);
            setToast({ type: "error", text: `Cleanup failed: ${err.message}` });
          });
      }

      function handleClearSession() {
        // Show confirmation dialog
        const confirmed = window.confirm(
          "This will delete all uploaded files and reset the session. Are you sure you want to continue?"
        );
        
        if (!confirmed) {
          return;
        }

        logToConsole("Clearing session...");

        fetch("/clear_session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              logToConsole(data.message || "Session cleared successfully");
              
              // Reset all UI state
              setUploadedFiles({ excel: [], pdf: [] });
              setExcelColumns([]);
              setTagColumn("");
              setCommentColumns([]);
              setHeaderRow(6);
              setHighlightColumn("");
              setHighlightColor("#FFFF00");
              setAnnotateExcel(false);
              setWatermarkEnabled(false);
              setWatermarkAttributes([]);
              setWatermarkTextColor("#000000");
              
              // Show success toast
              setToast({
                type: "success",
                text: data.message || "Session cleared successfully"
              });
            } else {
              logToConsole(`Error clearing session: ${data.message}`);
              setToast({
                type: "error",
                text: data.message || "Failed to clear session"
              });
            }
          })
          .catch((err) => {
            logToConsole(`Error clearing session: ${err.message}`);
            setToast({
              type: "error",
              text: `Error clearing session: ${err.message}`
            });
          });
      }


      return (
        <div className="flex min-h-screen flex-col">

                          setCommentColumns(excelColumns.filter((c) => c !== tagColumn))
                        }
                        className="rounded-lg bg-zinc-200/80 dark:bg-zinc-800 px-3 py-1.5 text-sm font-medium hover:bg-zinc-300/70 dark:hover:bg-zinc-700"
                      >
                        Select All
                      </button>
                      <button
                        type="button"
                        onClick={() => setCommentColumns([])}
                        className="rounded-lg bg-zinc-200/80 dark:bg-zinc-800 px-3 py-1.5 text-sm font-medium hover:bg-zinc-300/70 dark:hover:bg-zinc-700"
                      >
                        Select None
                      </button>
                    </div>
                    <div className="grid gap-2" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))" }}>
                      {excelColumns.length === 0 && (
                        <div className="text-sm text-zinc-500 dark:text-zinc-400">
                          Load Excel file to see available columns
                        </div>
                      )}
                      {excelColumns
                        .filter((c) => c !== tagColumn)
                        .map((c) => {
                          const checked = commentColumns.includes(c);
                          return (
                            <label
                              key={c}
                              className={cx(
                                "flex items-center gap-2 rounded-lg border px-3 py-2 text-sm cursor-pointer transition-colors",
                                checked
                                  ? "border-brand/50 bg-brand/5"
                                  : "border-zinc-200/60 dark:border-zinc-800 bg-transparent hover:bg-zinc-200/40 dark:hover:bg-zinc-800/60"
                              )}
                            >
                              <input
                                type="checkbox"
                                className="accent-brand"
                                checked={checked}
                                onChange={(e) => {
                                  if (e.target.checked) {
                                    setCommentColumns([...commentColumns, c]);
                                  } else {
                                    setCommentColumns(commentColumns.filter((x) => x !== c));
                                  }
                                }}
                              />
                              <span>{c}</span>
                            </label>
                          );
                        })}
                    </div>
                  </div>
                </div>

                <div className="excel-annotation-tutorial">
                  <h3 className="text-sm font-semibold text-zinc-500 dark:text-zinc-400 mb-3">Excel Annotation</h3>
                  <div className="grid gap-4 sm:grid-cols-2">
                    <div className="sm:col-span-2">
                      <label className="flex items-center gap-3">
                        <button
                          type="button"
                          role="switch"
                          aria-checked={annotateExcel}
                          onClick={() => setAnnotateExcel((v) => !v)}
                          className={cx(
                            "h-6 w-11 rounded-full transition-colors",
                            annotateExcel ? "bg-brand" : "bg-zinc-400/60 dark:bg-zinc-700"
                          )}
                        >
                          <span
                            className={cx(
                              "block h-5 w-5 rounded-full bg-white dark:bg-zinc-200 translate-x-0.5 transition-transform",
                              annotateExcel && "translate-x-[22px]"
                            )}
                          />
                        </button>
                        <span className="text-sm font-medium">Annotate Excel file</span>
                      </label>
                      <div className="mt-1 text-xs text-zinc-500 dark:text-zinc-400">
                        Highlight rows in light green where tags are found in the PDF
                      </div>
                    </div>
                  </div>
                </div>

                <div className="watermark-tutorial">
                  <h3 className="text-sm font-semibold text-zinc-500 dark:text-zinc-400 mb-3">Watermark</h3>
                  <div className="space-y-4">
                    <div>
                      <label className="flex items-center gap-3">
                        <button
                          type="button"
                          role="switch"
                          aria-checked={watermarkEnabled}
                          onClick={() => setWatermarkEnabled((v) => !v)}
                          className={cx(
                            "h-6 w-11 rounded-full transition-colors",
                            watermarkEnabled ? "bg-brand" : "bg-zinc-400/60 dark:bg-zinc-700"
                          )}
                        >
                          <span
                            className={cx(
                              "block h-5 w-5 rounded-full bg-white dark:bg-zinc-200 translate-x-0.5 transition-transform",
                              watermarkEnabled && "translate-x-[22px]"
                            )}
                          />
                        </button>
                        <span className="text-sm font-medium">Enable Watermark</span>
                      </label>
                    </div>
                    
                    {watermarkEnabled && (
                      <>
                        <div>
                          <label htmlFor="watermark-text-color" className="block text-sm font-medium mb-1">
                            Text Color
                          </label>
                          <input
                            id="watermark-text-color"
                            type="color"
                            value={watermarkTextColor}
                            onChange={(e) => setWatermarkTextColor(e.target.value)}
                            className="h-10 w-14 rounded-lg border border-zinc-300/70 dark:border-zinc-700 bg-white dark:bg-zinc-900 p-1"
                          />
                        </div>
                        
                        <div>
                          <label className="block text-sm font-medium mb-1">
                            Watermark Attributes (multiple allowed)
                          </label>
                          <div className="mb-2 flex flex-wrap gap-2">
                            <button
                              type="button"
                              onClick={() => setWatermarkAttributes(excelColumns.filter((c) => c !== tagColumn))}
                              className="rounded-lg bg-zinc-200/80 dark:bg-zinc-800 px-3 py-1.5 text-sm font-medium hover:bg-zinc-300/70 dark:hover:bg-zinc-700"
                            >
                              Select All
                            </button>
                            <button
                              type="button"
                              onClick={() => setWatermarkAttributes([])}
                              className="rounded-lg bg-zinc-200/80 dark:bg-zinc-800 px-3 py-1.5 text-sm font-medium hover:bg-zinc-300/70 dark:hover:bg-zinc-700"
                            >
                              Select None
                            </button>
                          </div>
                          <div className="grid gap-2" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))" }}>
                            {excelColumns.length === 0 && (
                              <div className="text-sm text-zinc-500 dark:text-zinc-400">
                                Load Excel file to see available columns
                              </div>
                            )}
                            {excelColumns.map((c) => {
                              const checked = watermarkAttributes.includes(c);
                              return (
                                <label
                                  key={c}
                                  className={cx(
                                    "flex items-center gap-2 rounded-lg border px-3 py-2 text-sm cursor-pointer transition-colors",
                                    checked
                                      ? "border-brand/50 bg-brand/5"
                                      : "border-zinc-200/60 dark:border-zinc-800 bg-transparent hover:bg-zinc-200/40 dark:hover:bg-zinc-800/60"
                                  )}
                                >
                                  <input
                                    type="checkbox"
                                    className="accent-brand"
                                    checked={checked}
                                    onChange={(e) => {
                                      if (e.target.checked) {
                                        setWatermarkAttributes([...watermarkAttributes, c]);
                                      } else {
                                        setWatermarkAttributes(watermarkAttributes.filter((x) => x !== c));
                                      }
                                    }}
                                  />
                                  <span>{c}</span>
                                </label>
                              );
                            })}
                          </div>
                        </div>
                      </>
                    )}
                  </div>
                </div>
              </div>



            </SectionCard>

            {/* Actions */}
            <SectionCard title="Actions">
              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                <button
                  onClick={() => startProcessing(false)}
                  className="start-button-tutorial inline-flex w-full items-center justify-center gap-2 rounded-xl bg-brand text-white px-4 py-3 font-semibold shadow-soft hover:bg-brand-hover transition-all hover:shadow-md hover:scale-[1.01]"
                >
                  <i className="fa-solid fa-play"></i>
                  Start
                </button>
                <button
                  onClick={() => startProcessing(true)}
                  className="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-warning text-black px-4 py-3 font-semibold shadow-soft hover:bg-warning-hover/90 transition-all hover:shadow-md hover:scale-[1.01]"
                >
                  <i className="fa-solid fa-bolt"></i>
                  Test Run (100 tags)
                </button>
                <button
                  onClick={handleClearSession}
                  className="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-danger text-white px-4 py-3 font-semibold shadow-soft hover:bg-danger-hover transition-all hover:shadow-md hover:scale-[1.01]"
                >
                  <i className="fa-solid fa-trash-can"></i>
                  Clear Session
                </button>
                <button
                  onClick={() => {
                    console.log('FAQ button clicked, current showFAQ:', showFAQ);
                    setShowFAQ(true);
                    console.log('setShowFAQ(true) called');
                  }}
                  className="faq-button-tutorial inline-flex w-full items-center justify-center gap-2 rounded-xl bg-zinc-200/90 dark:bg-zinc-800 px-4 py-3 font-semibold hover:bg-zinc-300/80 dark:hover:bg-zinc-700 transition-all"
                >
                  <i className="fa-solid fa-circle-question"></i>
                  FAQ
                </button>
              </div>
            </SectionCard>
          </main>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 left-0 right-0 mx-auto w-[92%] max-w-md z-50">
              <div
                className={cx(
                  "rounded-xl px-4 py-3 shadow-soft border backdrop-blur",
                  "bg-white/90 dark:bg-zinc-900/90 border-zinc-200/60 dark:border-zinc-800",
                  "flex items-center gap-3"
                )}
              >
                <i
                  className={cx(
                    "fa-solid",
                    toast.type === "error" && "fa-circle-xmark text-danger",
                    toast.type === "success" && "fa-circle-check text-success",
                    toast.type === "warning" && "fa-triangle-exclamation text-warning",
                    toast.type === "info" && "fa-circle-info text-brand"
                  )}
                />
                <div className="text-sm flex-1">{toast.text}</div>
                <button
                  className="p-2 rounded-lg hover:bg-zinc-200/60 dark:hover:bg-zinc-800"
                  onClick={() => setToast(null)}
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>
              </div>
            </div>
          )}

          {/* Modals */}
          <ProgressModal
            open={processingOpen}
            modeTitle={processingTitle}
            progress={progress}
            status={statusText}
            fileCount={fileCount}
            error={errorText}
            onClose={closeProcessing}
            onDownload={downloadFromModal}
            annotateExcelEnabled={annotateExcel}
            isTestRun={isCurrentTestRun}
            onStartFullRun={() => startProcessing(false)}
          />
          <SaveProfileModal
            open={showSaveProfileModal}
            onClose={() => setShowSaveProfileModal(false)}
            onSave={saveCurrentProfile}
          />
          <ImportProfileModal
            open={showImportProfileModal}
            onClose={() => setShowImportProfileModal(false)}
            onImport={importProfileFile}
          />
          <TutorialOverlay
            active={tutorialActive}
            currentStep={tutorialStep}
            onNext={nextTutorialStep}
            onPrev={prevTutorialStep}
            onSkip={skipTutorial}
            onComplete={completeTutorial}
          />
          <FAQModal open={showFAQ} onClose={() => setShowFAQ(false)} onStartTutorial={startTutorial} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  {% endraw %}
  </script>
</body>
</html>
