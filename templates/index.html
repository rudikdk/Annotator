  <!-- Prevent theme flash: set dark class before CSS loads -->
  <script>
    (function () {
      try {
        const stored = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    })();
  </script>

  <style>
    html,
    body {
      height: 100%;
    }

    /* Bounce animation for tag column selector when no "tag" column detected */
    @keyframes bounce-attention {
      0%, 100% {
        transform: translateY(0);
      }
      25% {
        transform: translateY(-10px);
      }
      50% {
        transform: translateY(0);
      }
      75% {
        transform: translateY(-5px);
      }
    }

    .animate-bounce-attention {
      animation: bounce-attention 1s ease-in-out 5;
    }

    /* Fast fade-in animation for tooltips */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
