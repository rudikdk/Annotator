                      <button
                        onClick={() => handleModalZoom('fitHeight')}
                        className="hidden md:block px-2 py-1 bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 rounded text-xs"
                        title="Fit Height"
                      >
                        <i className="fa-solid fa-arrows-up-down"></i>
                      </button>
                    </div>
                  </div>

                  {/* Stats & Download */}
                  {previewModalData && (
                    <div className="mt-3 flex flex-wrap items-center justify-between gap-4">
                      <div className="flex flex-wrap items-center gap-4 text-sm">
                        {/* Tag Statistics Badge */}
                        {previewModalData.stats && (
                          <div className="flex items-center gap-3 px-3 py-2 bg-gradient-to-r from-blue-50 to-green-50 dark:from-blue-900/20 dark:to-green-900/20 border border-blue-200 dark:border-blue-800/50 rounded-lg">
                            <div className="flex items-center gap-2">
                              <i className="fa-solid fa-tags text-blue-600 dark:text-blue-400"></i>
                              <span className="font-semibold text-zinc-700 dark:text-zinc-300">
                                Tags on page:
                              </span>
                            </div>
                            <div className="flex items-center gap-1">
                              <span className="text-lg font-bold text-green-600 dark:text-green-400">
                                {previewModalData.stats.colored_tags}
                              </span>
                              <span className="text-zinc-500 dark:text-zinc-400">/</span>
                              <span className="text-lg font-bold text-blue-600 dark:text-blue-400">
                                {previewModalData.stats.total_tags}
                              </span>
                              <span className="text-xs text-zinc-500 dark:text-zinc-400 ml-1">
                                colored
                              </span>
                            </div>
                            {previewModalData.stats.total_tags > 0 && (
                              <div className="flex items-center gap-1 px-2 py-0.5 bg-white/50 dark:bg-zinc-800/50 rounded-full">
                                <span className="text-xs font-medium text-zinc-600 dark:text-zinc-400">
                                  {Math.round((previewModalData.stats.colored_tags / previewModalData.stats.total_tags) * 100)}%
                                </span>
                              </div>
                            )}
                          </div>
                        )}
                        {previewModalData.stats.conflict_count > 0 && (
                          <div className="flex items-center gap-2 text-amber-600 dark:text-amber-400">
                            <i className="fa-solid fa-exclamation-triangle"></i>
                            <span>{previewModalData.stats.conflict_count} conflicts</span>
                          </div>
                        )}
                      </div>
                      {previewModalData.download_url && (
                        <button
                          onClick={() => {
                            window.location.href = previewModalData.download_url;
                            setToast({ type: "success", text: `Downloading ${previewModalData.preview_clean_name}` });
                          }}
                          className="px-4 py-2 bg-success hover:bg-success-hover text-white rounded-lg font-medium transition-colors flex items-center gap-2"
                          title="Download single-page annotated PDF"
                        >
                          <i className="fa-solid fa-download"></i>
                          <span className="hidden sm:inline">Download Preview PDF</span>
                          <span className="sm:hidden">Download</span>
                        </button>
                      )}
                    </div>
                  )}
                </div>

                {/* Modal Body */}
                <div className="flex-1 overflow-hidden p-4">
                  {previewModalLoading ? (
                    <div className="flex items-center justify-center h-full">
                      <div className="text-center">
                        <i className="fa-solid fa-spinner fa-spin text-4xl text-brand mb-3"></i>
                        <p className="text-zinc-600 dark:text-zinc-400">Loading preview...</p>
                      </div>
                    </div>
                  ) : previewModalData ? (
                    <div
                      ref={previewModalContainerRef}
                      className="w-full h-full overflow-hidden bg-zinc-100 dark:bg-zinc-950 rounded-lg p-4"
                      style={{ cursor: isModalDragging ? 'grabbing' : 'grab' }}
                      onWheel={handleModalWheel}
                      onMouseDown={handleModalMouseDown}
                      onMouseMove={handleModalMouseMove}
                      onMouseUp={handleModalMouseUp}
                      onMouseLeave={handleModalMouseUp}
                    >
                      <div style={{
                        display: 'inline-block',
                        minWidth: '100%',
                        textAlign: 'center',
                        transform: `translate(${modalPanOffset.x}px, ${modalPanOffset.y}px)`,
                        transition: isModalDragging ? 'none' : 'transform 0.1s ease-out'
                      }}>
                        <canvas
                          ref={previewCanvasRef}
                          className="block"
                          style={{
                            display: 'inline-block',
                            margin: '0 auto'
                          }}
                        />
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center justify-center h-full">
                      <p className="text-zinc-500 dark:text-zinc-400">No preview data</p>
                    </div>
                  )}
                </div>

                {/* Modal Footer */}
                {previewModalData && previewModalData.legend && (
                  <div className="flex-shrink-0 border-t border-zinc-200 dark:border-zinc-700 p-4 max-h-32 overflow-y-auto">
                    <div className="flex flex-wrap items-center gap-3">
                      <span className="text-sm font-medium text-zinc-600 dark:text-zinc-400">Legend:</span>
                      {(Array.isArray(previewModalData.legend) ? previewModalData.legend : Object.entries(previewModalData.legend)).map((item, idx) => {
                        // Handle both array format and object format
                        let color, tagText;
                        if (Array.isArray(item)) {
                          // Object.entries format: [color, description]
                          [color, tagText] = item;
                          // If tagText is still an object, extract the tag property
                          if (typeof tagText === 'object' && tagText !== null) {
                            tagText = tagText.tag || JSON.stringify(tagText);
                          }
                        } else {
                          // Array item format: {color, tag, ...}
                          color = item.color;
                          if (typeof item.tag === 'string') {
                            tagText = item.tag;
                          } else if (item.tag && typeof item.tag === 'object') {
                            tagText = item.tag.tag || JSON.stringify(item.tag);
                          } else {
                            tagText = String(item.tag || 'Unknown');
                          }
                        }

                        return (
                          <div key={idx} className="flex items-center gap-2">
                            <div
                              className="w-4 h-4 rounded border border-zinc-300 dark:border-zinc-600"
                              style={{ backgroundColor: color }}
                            ></div>
                            <span className="text-sm text-zinc-700 dark:text-zinc-300">{tagText}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  {% endraw %}
  </script>
</body>
</html>
